[databases]
# Shared / default databases (app-facing names -> physical backends)
auth = host=auth_db port=5432 dbname=auth_db
auth_ro = host=auth_db port=5432 dbname=auth_db
orders = host=order_db port=5432 dbname=order_db
orders_ro = host=order_db port=5432 dbname=order_db
products = host=product_db_master port=5432 dbname=product_db
products_ro = host=product_db_replica port=5432 dbname=product_db

# Auth Shards (2)
auth_s0 = host=auth_s0 port=5432 dbname=auth_s0
auth_s0_ro = host=auth_s0_replica port=5432 dbname=auth_s0
auth_s1 = host=auth_s1 port=5432 dbname=auth_s1
auth_s1_ro = host=auth_s1_replica port=5432 dbname=auth_s1

# Order Shards (4)
orders_s0 = host=order_s0 port=5432 dbname=order_s0
orders_s0_ro = host=order_s0_replica port=5432 dbname=order_s0
orders_s1 = host=order_s1 port=5432 dbname=order_s1
orders_s1_ro = host=order_s1_replica port=5432 dbname=order_s1
orders_s2 = host=order_s2 port=5432 dbname=order_s2
orders_s2_ro = host=order_s2_replica port=5432 dbname=order_s2
orders_s3 = host=order_s3 port=5432 dbname=order_s3
orders_s3_ro = host=order_s3_replica port=5432 dbname=order_s3

# Product Shards (4)
products_s0 = host=product_s0 port=5432 dbname=product_s0
products_s0_ro = host=product_s0_replica port=5432 dbname=product_s0
products_s1 = host=product_s1 port=5432 dbname=product_s1
products_s1_ro = host=product_s1_replica port=5432 dbname=product_s1
products_s2 = host=product_s2 port=5432 dbname=product_s2
products_s2_ro = host=product_s2_replica port=5432 dbname=product_s2
products_s3 = host=product_s3 port=5432 dbname=product_s3
products_s3_ro = host=product_s3_replica port=5432 dbname=product_s3

[pgbouncer]
pool_mode = transaction
max_client_conn = 200
default_pool_size = 25
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
log_connections = 0
log_disconnections = 0
server_check_query = SELECT 1
server_check_delay = 30
