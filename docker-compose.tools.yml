# ---------------------------------------------------------------------------
# docker-compose.tools.yml — Data tooling GUIs for the Floci/aws data plane
#
# In aws/floci mode the app runs in k8s and the data plane (RDS shards,
# ElastiCache Valkey, OpenSearch) lives on the Floci emulator's docker network.
# The main compose GUIs (pgAdmin/Redis Insight/Kibana) target compose services
# that never run in this mode, so they are replaced here with tools that:
#   * join the floci network (ecommerce-floci_floci_network) so they can reach
#     the real RDS/Valkey/OpenSearch containers, and
#   * publish their UIs on the host so you can open them in a browser.
#
#   pgAdmin:              http://localhost:5050   admin@skyline.dev / admin
#   Redis Insight:        http://localhost:5540   (add DB -> floci-valkey-<id>:6379)
#   OpenSearch Dashboards http://localhost:5601   (the "Kibana" for OpenSearch)
#   Nui (NATS UI):        http://localhost:31311  (live payloads for order.*, payment.*, ...)
#
# Started by scripts/deploy.sh after scripts/floci-infra.sh + floci-pgadmin.sh.
# ---------------------------------------------------------------------------
name: skyline-shop-tools

services:
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skyline.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./dist/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./dist/pgadmin/.pgpass:/var/lib/pgadmin/.pgpass:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/misc/ping || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - floci_network

  redis_insight:
    image: redis/redisinsight:2.64
    container_name: ecommerce_redis_insight
    restart: unless-stopped
    ports:
      - '5540:5540'
    environment:
      REDISINSIGHT_HOST: 0.0.0.0
    volumes:
      - redis_insight_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5540/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - floci_network

  # The Floci search store is OpenSearch, so the matching UI is OpenSearch
  # Dashboards (the same product family as the compose "Kibana" entry, which
  # only knows how to talk to Elasticsearch and would refuse to connect here).
  opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: ecommerce_os_dashboards
    restart: unless-stopped
    ports:
      - '5601:5601'
    environment:
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
      OPENSEARCH_HOSTS: '["http://floci-opensearch-skyline-shop-prod-search:9200"]'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:5601/api/status || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - floci_network

  # Nui — live NATS payload browser. Subscribe to the app's event subjects
  # (order.*, payment.*, inventory.*, ...) with wildcards and watch the real
  # JSON payloads stream in; you can also publish from the UI. It sits on the
  # ecommerce network next to the NATS cluster, so connect to
  # nats://ecommerce_nats_1:4222 in the UI.
  nui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: ecommerce_nui
    restart: unless-stopped
    ports:
      - '31311:31311'
    volumes:
      - nui_data:/db
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:31311/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce_network

networks:
  floci_network:
    external: true
    name: ecommerce-floci_floci_network
  ecommerce_network:
    external: true
    name: skyline-shop-commerceos-microservices_ecommerce_network

volumes:
  pgadmin_data:
  redis_insight_data:
  nui_data:
