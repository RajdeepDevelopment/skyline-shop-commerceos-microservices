name: 🛡️ Enterprise Branch Protection

on:
  push:
    branches:
      - main
      - development
      - 'release/**'
  pull_request:
    branches:
      - main
      - development
      - 'release/**'

concurrency:
  group: branch-protection-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  governance:
    name: Branch Governance Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 1. Block direct pushes to protected branches
      # --------------------------------------------------
      - name: 🚫 Prevent Direct Push to Protected Branches
        if: |
          github.event_name == 'push' && 
          (github.ref_name == 'main' || github.ref_name == 'development' || startsWith(github.ref_name, 'release/')) && 
          github.actor != 'RajdeepDevelopment' && 
          github.actor != 'dependabot[bot]'
        run: |
          echo "❌ Direct pushes to protected branches are not allowed for ${{ github.actor }}."
          echo "Please use a Pull Request to merge changes."
          exit 1

      # --------------------------------------------------
      # 2. Conventional commit validation (for both push & PR)
      # --------------------------------------------------
      - name: 📝 Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.js

      # --------------------------------------------------
      # 3. PR title must follow conventional commits
      # --------------------------------------------------
      - name: 📌 Validate Pull Request Title
        if: github.event_name == 'pull_request'
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          TITLE_PATTERN="^(feat|fix|docs|chore|refactor|test|ci|perf|hotfix|release|style|build)(\(.+\))?: .+$"

          if [[ ! $PR_TITLE =~ $TITLE_PATTERN ]]; then
            echo "❌ Invalid PR title: $PR_TITLE"
            echo "Use Conventional Commit style PR titles (e.g. feat(order): add idempotency)"
            exit 1
          fi

      # --------------------------------------------------
      # 4. Require PR size discipline (Relaxed to 100 files)
      # --------------------------------------------------
      - name: 📏 Prevent Oversized Pull Requests
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)

          echo "Changed files: $CHANGED_FILES"

          if [ "$CHANGED_FILES" -gt 100 ]; then
            echo "❌ PR too large ($CHANGED_FILES files). Please split this into smaller, focused PRs."
            echo "Maximum allowed changed files: 100"
            exit 1
          fi

      # --------------------------------------------------
      # 5. Prevent direct merge to main from non-release
      # --------------------------------------------------
      - name: 🔒 Require release branches for production
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"

          if [[ ! $SOURCE_BRANCH =~ ^(release|hotfix|development)\/ ]]; then
            echo "❌ Production merges to main must come from release/*, hotfix/* or development."
            exit 1
          fi
