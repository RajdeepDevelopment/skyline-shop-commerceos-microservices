name: Release

on:
  push:
    tags:
      - v*

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/skyline

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - cart-service
          - order-service
          - product-service
          - inventory-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Docker Images

            All service images are available at `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-<service>:${{ github.ref_name }}`

            Services: `api-gateway`, `auth-service`, `cart-service`, `order-service`, `product-service`, `inventory-service`, `payment-service`, `notification-service`

  deploy-production:
    runs-on: ubuntu-latest
    needs: create-github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in production kustomization
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          REGISTRY="${{ env.REGISTRY }}"
          OWNER="${{ github.repository_owner }}"

          for SERVICE in api-gateway auth-service cart-service order-service product-service inventory-service payment-service notification-service; do
            sed -i "s|${REGISTRY}/${OWNER}/skyline-${SERVICE}:.*|${REGISTRY}/${OWNER}/skyline-${SERVICE}:${VERSION}|g" \
              k8s/overlays/production/kustomization.yml
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yml
          git diff --staged --quiet || git commit -m "release: update production image tags to v${VERSION}"
          git push

      - name: Trigger ArgoCD sync (canary)
        run: |
          echo "ArgoCD will detect the change and deploy with canary strategy"
          echo "Updated images for version: ${GITHUB_REF#refs/tags/v}"
          echo "Canary deployment: 10% -> 25% -> 50% -> 100%"
