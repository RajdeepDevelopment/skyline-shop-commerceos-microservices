name: ✨ Feature Request
description: Propose a new feature or architectural pattern.
labels: [feature, discussion]
body:
  - type: markdown
    attributes:
      value: |
        We are always looking for new distributed systems patterns to demonstrate!
  - type: textarea
    id: goal
    attributes:
      label: Problem Statement / Learning Goal
      description: What problem does this solve, or what engineering pattern does it teach?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your idea for the implementation (e.g., adding a specific gRPC interceptor or a new sharding strategy).
    validations:
      required: true
  - type: checkboxes
    id: type
    attributes:
      label: This is related to:
      options:
        - label: Distributed Systems Patterns
        - label: Security & Identity
        - label: Scaling & Performance
        - label: Observability
