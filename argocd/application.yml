apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skyline-ecommerce-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: skyline-ecommerce

  source:
    repoURL: https://github.com/rajdeepsadhu/skyline-shop-commerceos-microservices.git
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s

  ignoredDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
