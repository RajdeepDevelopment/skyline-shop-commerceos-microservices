apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-staging

commonLabels:
  environment: staging
  managed-by: kustomize

resources:
  - ../../base/api-gateway.yml
  - ../../base/auth-service.yml
  - ../../base/cart-service.yml
  - ../../base/order-service.yml
  - ../../base/product-service.yml
  - ../../base/inventory-service.yml
  - ../../base/payment-service.yml
  - ../../base/notification-service.yml
  - ../../base/configmap.yml
  - ../../base/secrets.yml
  - ../../base/ingress.yml
  - ../../base/namespace.yml

patchesStrategicMerge:
  - configmap-data.yml

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  - target:
      kind: Deployment
      name: auth-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  - target:
      kind: Deployment
      name: cart-service
    patch: |
