apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ecommerce
  labels:
    app: jaeger
    component: tracing
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        component: tracing
        tier: observability
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.50
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5775
              name: zipkin
              protocol: UDP
            - containerPort: 6831
              name: thrift-compact
              protocol: UDP
            - containerPort: 6832
              name: thrift-binary
              protocol: UDP
            - containerPort: 5778
              name: config-rest
            - containerPort: 14268
              name: http-collector
            - containerPort: 14250
              name: grpc-collector
            - containerPort: 9411
              name: zipkin-http
            - containerPort: 16686
              name: query-http
            - containerPort: 14269
              name: admin
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            - name: SAMPLER_TYPE
              value: "const"
            - name: SAMPLER_PARAM
              value: "1"
            - name: QUERY_BASE_PATH
              value: "/"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: ecommerce
  labels:
    app: jaeger
    component: tracing
    tier: observability
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: http-collector
      port: 14268
      targetPort: 14268
    - name: grpc-collector
      port: 14250
      targetPort: 14250
    - name: zipkin
      port: 9411
      targetPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: ecommerce
  labels:
    app: jaeger
    component: tracing
    tier: observability
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: query-http
      port: 16686
      targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ecommerce
  labels:
    app: jaeger
    component: tracing
    tier: observability
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: admin
      port: 14269
      targetPort: 14269
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: ecommerce
  labels:
    app: jaeger
    component: tracing
    tier: observability
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: thrift-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: thrift-binary
      port: 6832
      targetPort: 6832
      protocol: UDP
