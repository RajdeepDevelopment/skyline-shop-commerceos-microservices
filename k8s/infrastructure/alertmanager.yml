apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ecommerce
  labels:
    app: alertmanager
    component: monitoring
    tier: observability
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.ecommerce.svc.cluster.local:587"
      smtp_from: "alertmanager@skyline.shop"
      smtp_auth_username: "alertmanager@skyline.shop"
      smtp_auth_password: ""
      smtp_require_tls: true
    
    templates:
      - "/etc/alertmanager/templates/*.tmpl"
    
    route:
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default-receiver"
      routes:
        - match:
            severity: critical
          receiver: "critical-receiver"
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: "warning-receiver"
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        - match:
            severity: info
          receiver: "default-receiver"
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 8h
    
    receivers:
      - name: "default-receiver"
        email_configs:
          - to: "ops-team@skyline.shop"
            send_resolved: true
            headers:
              Subject: "[SKYLINE] {{ .GroupLabels.alertname }} - {{ .Status | toUpper }}"
      
      - name: "critical-receiver"
        email_configs:
          - to: "ops-team@skyline.shop"
            send_resolved: true
            headers:
              Subject: "[SKYLINE-CRITICAL] {{ .GroupLabels.alertname }}"
      
      - name: "warning-receiver"
        email_configs:
          - to: "ops-team@skyline.shop"
            send_resolved: true
            headers:
              Subject: "[SKYLINE-WARNING] {{ .GroupLabels.alertname }}"
    
    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ["alertname", "namespace"]
  receivers.yml: |
    {{ define "skyline.default.receiver" }}
    {{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ecommerce
  labels:
    app: alertmanager
    component: monitoring
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        component: monitoring
        tier: observability
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=http://alertmanager.ecommerce.svc.cluster.local:9093"
            - "--cluster.listen-address=0.0.0.0:9094"
          ports:
            - containerPort: 9093
              name: http
            - containerPort: 9094
              name: cluster
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager
            - name: alertmanager-data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
        - name: alertmanager-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ecommerce
  labels:
    app: alertmanager
    component: monitoring
    tier: observability
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
    - name: cluster
      port: 9094
      targetPort: 9094
