apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: default-hpa
  namespace: ecommerce
  labels:
    app: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: default-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
