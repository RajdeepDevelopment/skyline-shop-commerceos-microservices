# ---------------------------------------------------------------------------
# ecommerce-secrets — DEV-ONLY fallback Secret (readable, committed)
#
# stringData keeps values human-readable in this repo. The values below are
# PLACEHOLDERS for local/dev and are NEVER used by the deploy pipeline.
#
# scripts/deploy.sh pulls the real values from AWS Secrets Manager at deploy
# time (secret: <project>/<env>/app-secrets) and writes the rendered Secret to
# dist/k8s-rendered/base/secrets.yml, so nothing sensitive is committed.
#
# In real AWS the pods can read Secrets Manager directly through the IRSA roles
# in infrastructure/aws/iam.tf (secretsmanager:GetSecretValue + ssm:GetParameter),
# which is the path to use once External Secrets Operator is installed.
#
# Deployments reference this Secret via envFrom.secretRef.name = ecommerce-secrets.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # JWT signing keys (min 32 chars — validated by libs/config)
  JWT_SECRET: "dev-only-change-me-jwt-secret-0000000000"
  JWT_REFRESH_SECRET: "dev-only-change-me-jwt-refresh-secret-0000"

  # Database password used by the app services (matching docker-compose dev values)
  POSTGRES_PASSWORD: "password"
