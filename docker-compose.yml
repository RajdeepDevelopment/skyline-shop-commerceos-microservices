    depends_on:
      auth_db: { condition: service_healthy }
      auth_s0: { condition: service_healthy }
      auth_s0_replica: { condition: service_healthy }
      auth_s1: { condition: service_healthy }
      auth_s1_replica: { condition: service_healthy }
      availability_db: { condition: service_healthy }
      order_db: { condition: service_healthy }
      order_s0: { condition: service_healthy }
      order_s0_replica: { condition: service_healthy }
      order_s1: { condition: service_healthy }
      order_s1_replica: { condition: service_healthy }
      order_s2: { condition: service_healthy }
      order_s2_replica: { condition: service_healthy }
      order_s3: { condition: service_healthy }
      order_s3_replica: { condition: service_healthy }
      product_db_master: { condition: service_healthy }
      product_db_replica: { condition: service_healthy }
      product_s0: { condition: service_healthy }
      product_s0_replica: { condition: service_healthy }
