      start_period: 20s

  # ---------------------------------------------------------------------------
  # Availability service — pincode serviceability, warehouse inventory,
  # reservation lifecycle. Own Postgres (no sharding) + Redis cache + NATS.
  # ---------------------------------------------------------------------------
  availability-service:
    <<: *service-base
    build:
      context: .
      dockerfile: apps/availability-service/Dockerfile
    container_name: ecommerce_availability_service
    ports:
      - '3009:3009'
    environment:
      NODE_ENV: development
      SERVICE_NAME: AVAILABILITY
      AVAILABILITY_SERVICE_PORT: '3009'
      DATABASE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@availability_db:5432/availability_db?schema=public
      AVAILABILITY_DATABASE_WRITE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@availability_db:5432/availability_db?schema=public
      AVAILABILITY_DATABASE_READ_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@availability_db:5432/availability_db?schema=public
      NATS_URL: nats://nats_1:4222
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      RESERVATION_TTL_MIN: '15'
      AVAILABILITY_CACHE_TTL_SECONDS: '600'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3009/availability/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ---------------------------------------------------------------------------
  # Web shop — React/Vite SPA served by nginx (http://localhost:8080)
  # ---------------------------------------------------------------------------
  web-shop:
    build:
      context: .
      dockerfile: apps/web-shop/Dockerfile
    container_name: ecommerce_web_shop
    restart: unless-stopped
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce_network

  # ---------------------------------------------------------------------------
  # Observability — OpenTelemetry, Jaeger, Elasticsearch, Kibana
  # ---------------------------------------------------------------------------
  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: ecommerce_otel_collector
    restart: unless-stopped
    ports:
      - '4317:4317'   # OTLP gRPC
      - '4318:4318'   # OTLP HTTP
      - '8889:8889'   # Prometheus exporter
    volumes:
      - ./infrastructure/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    networks:
      - ecommerce_network

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ecommerce_jaeger
    restart: unless-stopped
    ports:
      - '16686:16686'  # Jaeger UI
      - '14250:14250'  # gRPC for collector
      - '14268:14268'  # HTTP for collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    volumes:
      - jaeger_data:/badger
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:14269/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ecommerce_network

  es1:
    <<: *es-base
    container_name: ecommerce_es1
    environment:
      <<: *es-env
      node.name: es1
      discovery.seed_hosts: es2,es3
    ports:
      - '9200:9200'
    volumes:
      - es1_data:/usr/share/elasticsearch/data

  es2:
    <<: *es-base
    container_name: ecommerce_es2
    environment:
      <<: *es-env
      node.name: es2
      discovery.seed_hosts: es1,es3
    volumes:
      - es2_data:/usr/share/elasticsearch/data

  es3:
    <<: *es-base
    container_name: ecommerce_es3
    environment:
      <<: *es-env
      node.name: es3
      discovery.seed_hosts: es1,es2
    volumes:
      - es3_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: ecommerce_kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://es1:9200
    ports:
      - '5601:5601'
    depends_on:
      es1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:5601/api/status || exit 1']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ecommerce_network

  # ---------------------------------------------------------------------------
  # Monitoring — Prometheus, Alertmanager, Grafana
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ecommerce_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9090/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ecommerce_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ecommerce_alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9093/-/healthy || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ecommerce_network

  grafana:
    image: grafana/grafana:10.0.3
    container_name: ecommerce_grafana
    restart: unless-stopped
    ports:
      - '3100:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ecommerce_network

  nats_surveyor:
    image: natsio/nats-surveyor:latest
    container_name: ecommerce_nats_surveyor
    restart: unless-stopped
    ports:
      - '7777:7777'
    environment:
      - NATS_SURVEYOR_SERVERS=nats://nats_1:4222,nats://nats_2:4222,nats://nats_3:4222,nats://nats_4:4222,nats://nats_5:4222,nats://nats_3:4222
      - NATS_SURVEYOR_COUNT=3
      - NATS_SURVEYOR_PORT=7777
    depends_on:
      nats_1:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:7777/metrics || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ecommerce_network

  # ---------------------------------------------------------------------------
  # GUIs — Redis Insight, pgAdmin
  # ---------------------------------------------------------------------------
  redis_insight:
    image: redis/redisinsight:2.64
    container_name: ecommerce_redis_insight
    restart: unless-stopped
    ports:
      - '5540:5540'
    environment:
      - REDISINSIGHT_HOST=0.0.0.0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5540/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - ecommerce_network

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@skyline.dev
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_LISTEN_PORT=80
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      auth_db: { condition: service_healthy }
      order_db: { condition: service_healthy }
      product_db_master: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/misc/ping || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ecommerce_network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  auth_db_data:
  order_db_data:
  availability_db_data:
  product_db_master_data:
  product_db_replica_data:
  auth_s0_data:
  auth_s0_replica_data:
  auth_s1_data:
  auth_s1_replica_data:
  order_s0_data:
  order_s0_replica_data:
  order_s1_data:
  order_s1_replica_data:
  order_s2_data:
  order_s2_replica_data:
  order_s3_data:
  order_s3_replica_data:
  product_s0_data:
  product_s0_replica_data:
  product_s1_data:
  product_s1_replica_data:
  product_s2_data:
  product_s2_replica_data:
  product_s3_data:
  product_s3_replica_data:
  redis_data:
  nats_1_data:
  nats_2_data:
  nats_3_data:
  nats_4_data:
  nats_5_data:
  jaeger_data:
  es1_data:
  es2_data:
  es3_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  pgadmin_data:
  clickhouse_data:

