      dockerfile: apps/api-gateway/Dockerfile
    container_name: ecommerce_api_gateway
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      API_GATEWAY_PORT: '3000'
      DATABASE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@auth_db:5432/auth_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_enterprise_key_change_me_in_prod}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_me_in_prod}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      CART_SERVICE_URL: http://cart-service:3005
      PRODUCT_SERVICE_URL: http://product-service:3003
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3007
      AVAILABILITY_SERVICE_URL: http://availability-service:3009
      GRPC_AUTH_URL: auth-service:50051
      GRPC_ORDER_URL: order-service:50056
      GRPC_PRODUCT_URL: product-service:50053
      NATS_URL: nats://nats_1:4222
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      ELASTICSEARCH_URL: http://es1:9200
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

