    environment:
      NODE_ENV: development
      SERVICE_NAME: ORDER
      PAYMENT_SERVICE_PORT: '3007'
      DATABASE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@auth_db:5432/auth_db?schema=public
      ORDER_S0_DATABASE_WRITE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@order_s0:5432/order_s0?schema=public
      ORDER_S0_DATABASE_READ_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@order_s0_replica:5432/order_s0?schema=public
      ORDER_S1_DATABASE_WRITE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@order_s1:5432/order_s1?schema=public
      ORDER_S1_DATABASE_READ_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@order_s1_replica:5432/order_s1?schema=public
      ORDER_S2_DATABASE_WRITE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@order_s2:5432/order_s2?schema=public
      ORDER_S2_DATABASE_READ_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@order_s2_replica:5432/order_s2?schema=public
      ORDER_S3_DATABASE_WRITE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@order_s3:5432/order_s3?schema=public
