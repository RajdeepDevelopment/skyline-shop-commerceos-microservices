# =============================================================================
# Skyline Shop — e-commerce microservices stack (docker compose)
#
# One command to run everything:   docker compose up -d
#   - Postgres (main DBs, shards, read replicas) + PgBouncer + Redis + NATS
#   - Elasticsearch / Kibana / Jaeger / Prometheus / Grafana / pgAdmin / RedisInsight
#   - `bootstrap` one-shot: pushes prisma/schema.prisma to every DB and seeds
#     10k products into the product shards + Elasticsearch
#   - 7 NestJS microservices + API gateway + React web-shop (http://localhost:8080)
#
# Reuse anchors (x-*) keep the file DRY — each entry just overrides name/port/volume.
# =============================================================================

# -----------------------------------------------------------------------------
# Shared config (YAML anchors — not services)
# -----------------------------------------------------------------------------
x-postgres-env: &postgres-env
  POSTGRES_USER: root
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}

x-postgres-base: &postgres-base
  image: postgres:15-alpine
  restart: unless-stopped
  environment:
    <<: *postgres-env
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U root']
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  networks:
    - ecommerce_network

x-pgbouncer-base: &pgbouncer-base
  image: edoburu/pgbouncer:v1.25.2-p0
  restart: unless-stopped
  ports:
    - '6432:6432'
  volumes:
    - ./infrastructure/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    - ./infrastructure/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
  networks:
    - ecommerce_network

x-nats-base: &nats-base
  image: nats:2.9-alpine
  restart: unless-stopped
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://localhost:8222/healthz || exit 1']
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s
  networks:
    - ecommerce_network

x-es-env: &es-env
  cluster.name: ecommerce-es-cluster
  cluster.initial_master_nodes: es1,es2,es3
  bootstrap.memory_lock: 'true'
  xpack.security.enabled: 'false'
  xpack.security.http.ssl.enabled: 'false'
  ES_JAVA_OPTS: '-Xms512m -Xmx512m'
  network.host: 0.0.0.0

x-es-base: &es-base
  image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
  restart: unless-stopped
  environment:
    <<: *es-env
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
    interval: 20s
    timeout: 10s
    retries: 5
    start_period: 60s
  networks:
    - ecommerce_network

# Shared settings for the NestJS microservices (each one waits for `bootstrap`
# to finish so the DB schema + seed data exist before it starts).
x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    bootstrap:
      condition: service_completed_successfully
  networks:
    - ecommerce_network

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — main databases
  # ---------------------------------------------------------------------------
  auth_db:
    <<: *postgres-base
    container_name: ecommerce_auth_db
    environment:
      <<: *postgres-env
      POSTGRES_DB: auth_db
    ports:
      - '5433:5432'
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  order_db:
    <<: *postgres-base
    container_name: ecommerce_order_db
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_db
    ports:
      - '5434:5432'
    volumes:
      - order_db_data:/var/lib/postgresql/data

  availability_db:
    <<: *postgres-base
    container_name: ecommerce_availability_db
    environment:
      <<: *postgres-env
      POSTGRES_DB: availability_db
    ports:
      - '5440:5432'
    volumes:
      - availability_db_data:/var/lib/postgresql/data


  product_db_master:
    <<: *postgres-base
    container_name: ecommerce_product_db_master
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_db
    ports:
      - '5435:5432'
    volumes:
      - product_db_master_data:/var/lib/postgresql/data

  product_db_replica:
    <<: *postgres-base
    container_name: ecommerce_product_db_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_db
    ports:
      - '5436:5432'
    volumes:
      - product_db_replica_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # PostgreSQL — auth shards (2 x primary + replica)
  # ---------------------------------------------------------------------------
  auth_s0:
    <<: *postgres-base
    container_name: ecommerce_auth_s0
    environment:
      <<: *postgres-env
      POSTGRES_DB: auth_s0
    ports:
      - '5441:5432'
    volumes:
      - auth_s0_data:/var/lib/postgresql/data

  auth_s0_replica:
    <<: *postgres-base
    container_name: ecommerce_auth_s0_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: auth_s0
    ports:
      - '5442:5432'
    volumes:
      - auth_s0_replica_data:/var/lib/postgresql/data

  auth_s1:
    <<: *postgres-base
    container_name: ecommerce_auth_s1
    environment:
      <<: *postgres-env
      POSTGRES_DB: auth_s1
    ports:
      - '5443:5432'
    volumes:
      - auth_s1_data:/var/lib/postgresql/data

  auth_s1_replica:
    <<: *postgres-base
    container_name: ecommerce_auth_s1_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: auth_s1
    ports:
      - '5444:5432'
    volumes:
      - auth_s1_replica_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # PostgreSQL — order shards (4 x primary + replica)
  # ---------------------------------------------------------------------------
  order_s0:
    <<: *postgres-base
    container_name: ecommerce_order_s0
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s0
    ports:
      - '5451:5432'
    volumes:
      - order_s0_data:/var/lib/postgresql/data

  order_s0_replica:
    <<: *postgres-base
    container_name: ecommerce_order_s0_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s0
    ports:
      - '5452:5432'
    volumes:
      - order_s0_replica_data:/var/lib/postgresql/data

  order_s1:
    <<: *postgres-base
    container_name: ecommerce_order_s1
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s1
    ports:
      - '5453:5432'
    volumes:
      - order_s1_data:/var/lib/postgresql/data

  order_s1_replica:
    <<: *postgres-base
    container_name: ecommerce_order_s1_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s1
    ports:
      - '5454:5432'
    volumes:
      - order_s1_replica_data:/var/lib/postgresql/data

  order_s2:
    <<: *postgres-base
    container_name: ecommerce_order_s2
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s2
    ports:
      - '5455:5432'
    volumes:
      - order_s2_data:/var/lib/postgresql/data

  order_s2_replica:
    <<: *postgres-base
    container_name: ecommerce_order_s2_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s2
    ports:
      - '5456:5432'
    volumes:
      - order_s2_replica_data:/var/lib/postgresql/data

  order_s3:
    <<: *postgres-base
    container_name: ecommerce_order_s3
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s3
    ports:
      - '5457:5432'
    volumes:
      - order_s3_data:/var/lib/postgresql/data

  order_s3_replica:
    <<: *postgres-base
    container_name: ecommerce_order_s3_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: order_s3
    ports:
      - '5458:5432'
    volumes:
      - order_s3_replica_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # PostgreSQL — product shards (4 x primary + replica)
  # ---------------------------------------------------------------------------
  product_s0:
    <<: *postgres-base
    container_name: ecommerce_product_s0
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s0
    ports:
      - '5461:5432'
    volumes:
      - product_s0_data:/var/lib/postgresql/data

  product_s0_replica:
    <<: *postgres-base
    container_name: ecommerce_product_s0_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s0
    ports:
      - '5462:5432'
    volumes:
      - product_s0_replica_data:/var/lib/postgresql/data

  product_s1:
    <<: *postgres-base
    container_name: ecommerce_product_s1
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s1
    ports:
      - '5463:5432'
    volumes:
      - product_s1_data:/var/lib/postgresql/data

  product_s1_replica:
    <<: *postgres-base
    container_name: ecommerce_product_s1_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s1
    ports:
      - '5464:5432'
    volumes:
      - product_s1_replica_data:/var/lib/postgresql/data

  product_s2:
    <<: *postgres-base
    container_name: ecommerce_product_s2
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s2
    ports:
      - '5465:5432'
    volumes:
      - product_s2_data:/var/lib/postgresql/data

  product_s2_replica:
    <<: *postgres-base
    container_name: ecommerce_product_s2_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s2
    ports:
      - '5466:5432'
    volumes:
      - product_s2_replica_data:/var/lib/postgresql/data

  product_s3:
    <<: *postgres-base
    container_name: ecommerce_product_s3
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s3
    ports:
      - '5467:5432'
    volumes:
      - product_s3_data:/var/lib/postgresql/data

  product_s3_replica:
    <<: *postgres-base
    container_name: ecommerce_product_s3_replica
    environment:
      <<: *postgres-env
      POSTGRES_DB: product_s3
    ports:
      - '5468:5432'
    volumes:
      - product_s3_replica_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # PgBouncer — shared pooler + one pooler per shard
  # ---------------------------------------------------------------------------
  pgbouncer:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer
    depends_on:
      auth_db: { condition: service_healthy }
      order_db: { condition: service_healthy }
      product_db_master: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pgbouncer_auth_s0:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_auth_s0
    ports:
      - '6441:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@auth_s0:5432/auth_s0,postgresql://root:${POSTGRES_PASSWORD:-password}@auth_s0_replica:5432/auth_s0"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      auth_s0: { condition: service_healthy }

  pgbouncer_auth_s1:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_auth_s1
    ports:
      - '6442:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@auth_s1:5432/auth_s1,postgresql://root:${POSTGRES_PASSWORD:-password}@auth_s1_replica:5432/auth_s1"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      auth_s1: { condition: service_healthy }

  pgbouncer_order_s0:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_order_s0
    ports:
      - '6451:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@order_s0:5432/order_s0,postgresql://root:${POSTGRES_PASSWORD:-password}@order_s0_replica:5432/order_s0"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      order_s0: { condition: service_healthy }

  pgbouncer_order_s1:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_order_s1
    ports:
      - '6452:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@order_s1:5432/order_s1,postgresql://root:${POSTGRES_PASSWORD:-password}@order_s1_replica:5432/order_s1"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      order_s1: { condition: service_healthy }

  pgbouncer_order_s2:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_order_s2
    ports:
      - '6453:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@order_s2:5432/order_s2,postgresql://root:${POSTGRES_PASSWORD:-password}@order_s2_replica:5432/order_s2"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      order_s2: { condition: service_healthy }

  pgbouncer_order_s3:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_order_s3
    ports:
      - '6454:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@order_s3:5432/order_s3,postgresql://root:${POSTGRES_PASSWORD:-password}@order_s3_replica:5432/order_s3"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      order_s3: { condition: service_healthy }

  pgbouncer_product_s0:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_product_s0
    ports:
      - '6461:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@product_s0:5432/product_s0,postgresql://root:${POSTGRES_PASSWORD:-password}@product_s0_replica:5432/product_s0"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 30
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      product_s0: { condition: service_healthy }

  pgbouncer_product_s1:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_product_s1
    ports:
      - '6462:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@product_s1:5432/product_s1,postgresql://root:${POSTGRES_PASSWORD:-password}@product_s1_replica:5432/product_s1"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 30
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      product_s1: { condition: service_healthy }

  pgbouncer_product_s2:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_product_s2
    ports:
      - '6463:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@product_s2:5432/product_s2,postgresql://root:${POSTGRES_PASSWORD:-password}@product_s2_replica:5432/product_s2"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 30
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      product_s2: { condition: service_healthy }

  pgbouncer_product_s3:
    <<: *pgbouncer-base
    container_name: ecommerce_pgbouncer_product_s3
    ports:
      - '6464:6432'
    environment:
      DATABASE_URLS: "postgresql://root:${POSTGRES_PASSWORD:-password}@product_s3:5432/product_s3,postgresql://root:${POSTGRES_PASSWORD:-password}@product_s3_replica:5432/product_s3"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 30
      MAX_CLIENT_CONN: 500
      LISTEN_PORT: 6432
    depends_on:
      product_s3: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Redis + NATS JetStream cluster
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce_network

  nats_1:
    <<: *nats-base
    container_name: ecommerce_nats_1
    ports:
      - '4222:4222'
      - '8222:8222'
    command: >
      --server_name nats_1 --cluster_name ecommerce_nats_cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats_2:6222,nats://nats_3:6222
      --js --sd /data -m 8222
    volumes:
      - nats_1_data:/data

  nats_2:
    <<: *nats-base
    container_name: ecommerce_nats_2
    ports:
      - '4223:4222'
      - '8223:8222'
    command: >
      --server_name nats_2 --cluster_name ecommerce_nats_cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats_1:6222,nats://nats_3:6222
      --js --sd /data -m 8222
    volumes:
      - nats_2_data:/data

  nats_3:
    <<: *nats-base
    container_name: ecommerce_nats_3
    ports:
      - '4224:4222'
      - '8224:8222'
    command: >
      --server_name nats_3 --cluster_name ecommerce_nats_cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats_1:6222,nats://nats_2:6222,nats://nats_4:6222,nats://nats_5:6222
      --js --sd /data -m 8222
    volumes:
      - nats_3_data:/data

  nats_4:
    <<: *nats-base
    container_name: ecommerce_nats_4
    ports:
      - '4225:4222'
      - '8225:8222'
    command: >
      --server_name nats_4 --cluster_name ecommerce_nats_cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats_1:6222,nats://nats_2:6222,nats://nats_3:6222,nats://nats_5:6222
      --js --sd /data -m 8222
    volumes:
      - nats_4_data:/data

  nats_5:
    <<: *nats-base
    container_name: ecommerce_nats_5
    ports:
      - '4226:4222'
      - '8226:8222'
    command: >
      --server_name nats_5 --cluster_name ecommerce_nats_cluster
      --cluster nats://0.0.0.0:6222
      --routes nats://nats_1:6222,nats://nats_2:6222,nats://nats_3:6222,nats://nats_4:6222
      --js --sd /data -m 8222
    volumes:
      - nats_5_data:/data

  # ---------------------------------------------------------------------------
  # ClickHouse — behaviour analytics / ranking history
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: ecommerce_clickhouse
    restart: unless-stopped
    ports:
      - '8123:8123'   # HTTP interface
      - '9000:9000'   # Native interface
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/users.d/zzz-allow-network.xml:/etc/clickhouse-server/users.d/zzz-allow-network.xml:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce_network

  # ---------------------------------------------------------------------------
  # Nginx load balancer (proxies to the API gateway)
  # ---------------------------------------------------------------------------
  nginx_lb:
    image: nginx:alpine
    container_name: ecommerce_lb
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:80/health || exit 1']
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ecommerce_network

  # ---------------------------------------------------------------------------
  # Bootstrap — one-shot: push schema to every DB, then seed product shards + ES.
  # Runs once on `up`; every backend waits for it to finish successfully.
  # ---------------------------------------------------------------------------
  bootstrap:
    build:
      context: .
      dockerfile: docker/bootstrap.Dockerfile
    container_name: ecommerce_bootstrap
    restart: 'no'
    environment:
      ELASTICSEARCH_URL: http://es1:9200
      SEED_TARGET: compose
      SEED_PRODUCT_COUNT: '10000'
      AVAILABILITY_DATABASE_URL: postgresql://root:${POSTGRES_PASSWORD:-password}@availability_db:5432/availability_db?schema=public
      MIGRATE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      MIGRATE_URLS: >-
        postgresql://root:${POSTGRES_PASSWORD:-password}@auth_db:5432/auth_db?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@availability_db:5432/availability_db?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_db_master:5432/product_db?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_db_replica:5432/product_db?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@auth_s0:5432/auth_s0?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@auth_s0_replica:5432/auth_s0?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@auth_s1:5432/auth_s1?schema=public,
