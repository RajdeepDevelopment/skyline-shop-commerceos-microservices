        postgresql://root:${POSTGRES_PASSWORD:-password}@order_s2_replica:5432/order_s2?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@order_s3:5432/order_s3?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@order_s3_replica:5432/order_s3?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s0:5432/product_s0?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s0_replica:5432/product_s0?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s1:5432/product_s1?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s1_replica:5432/product_s1?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s2:5432/product_s2?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s2_replica:5432/product_s2?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s3:5432/product_s3?schema=public,
        postgresql://root:${POSTGRES_PASSWORD:-password}@product_s3_replica:5432/product_s3?schema=public
